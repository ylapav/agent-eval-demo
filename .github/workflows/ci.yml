name: ci

on:
  push:
  pull_request:

# Ajetaan aina, ilman salaisuuksia.
#
# Tyyppitarkistus, turvakerroksen yksikkötestit, /demo-reitin
# kustannuslupaus ja rakennus eivät tarvitse API-avaimia eivätkä
# tietokantapalvelua — se on tarkoituksellista. Turvasäännöt, joiden
# testaaminen vaatii infrastruktuuria, ovat sääntöjä joita ei ajeta.
#
# Evaluointi on omassa työnkulussaan (eval.yml), koska se maksaa rahaa ja
# vaatii salaisuudet, joita forkin PR ei saa.

jobs:
  tarkistus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
